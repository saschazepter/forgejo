on:
  # pull_request_target seems like an appropriate choice here because it would run automatically on untrusted, forked
  # pull requests, which seems to make sense for a workflow that just labels PRs.  However, labeling then causes the
  # end-to-end tests to run against the PR, which means that any malicious code in the PR will be shoved into the
  # end-to-end workflow and automatically run as a trusted PR from a cascade.  In order to avoid that, this is triggered
  # on pull_request instead -- it needs to be approved for a fork PR.
  pull_request:
    types: [opened, reopened]

name: pr-auto-label

# Authorized Integration is used for authenticating the API calls.  The expected configuration of that Authorized
# Integration, documented for posterity if it ever needs to be recreated, is:
# - Add Authorized Integration on /user/settings/authorized-integrations, "Forgejo Actions (Local)"
# - Source repository: `forgejo/forgejo`
# - Workflow file: `pr-auto-label.yml`
# - Event: `pull_request`
# - Capabilities Permitted
#     - Specific repositories: `forgejo/forgejo``
#     - Issue: Read and write
# The generated `aud` Claim must be provided in a variable PR_AUTO_LABEL_AI_AUD, set at the repo level.
enable-openid-connect: true

jobs:
  label-run-end-to-end-tests:
    runs-on: docker
    container:
      image: data.forgejo.org/oci/ci:3
    steps:
      - name: fetch PR diff
        run: |
          curl "$DIFF_URL" > pr.diff
        env:
          DIFF_URL: ${{ forgejo.event.pull_request.diff_url }}
      - name: check for affected paths
        id: check
        run: |
          add_label=
          for p in models/actions services/actions routers/api/actions models/forgefed modules/activitypub modules/forgefed services/federation routers/api/v1/activitypub
          do
            # Diff formatting will have a newline followed by +++ b/(filename); here we search for a line that starts
            # with that prefix to identify if the path in $p is modified in this diff.  If it doesn't match grep returns
            # a non-zero exit code, which we ignore (|| true).
            c=$(grep -c "^+++ b/$p" pr.diff || true)
            if [[ $c -ne 0 ]];
            then
              echo "Found modification to $c files in path $p"
              add_label=true
            fi
          done
          if [[ $add_label == '' ]];
          then
            echo "No matching paths found."
          fi
          echo "add_label=$add_label" >> $FORGEJO_OUTPUT
      - name: add run-end-to-end-tests label
        if: steps.check.outputs.add_label
        run: |
          # Labelling PRs is authenticated with an authorized integration to workaround the restriction that events
          # performed by the "Forgejo Actions" user (secrets.forgejo_token) don't trigger additional workflows.
          jwt=$( \
            curl --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$PR_AUTO_LABEL_AI_AUD" \
            | jq -r ".value" \
          )
          echo "::add-mask::$jwt"

          # POST /repos/{owner}/{repo}/issues/{index}/labels will add a label; if the labels already exist, the request
          # succeeds without a failure.
          curl \
            --fail \
            -H "Authorization: bearer $jwt" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"labels": ["run-end-to-end-tests"]}' \
            "$SERVER_URL/api/v1/repos/$REPO/issues/$PR_NUM/labels"
        env:
          SERVER_URL: ${{ forgejo.server_url }}
          REPO: ${{ forgejo.event.repository.full_name }}
          PR_NUM: ${{ forgejo.event.pull_request.number }}
          PR_AUTO_LABEL_AI_AUD: ${{ vars.PR_AUTO_LABEL_AI_AUD }} # audience for an authorized integration used here
